# Package-owned release for rawphp/capabilities-cli (binary: capabilities).
#
# After monorepo split force-pushes a mirrored v* tag onto this repo, this
# workflow builds multi-arch binaries with GoReleaser and creates or updates
# the GitHub Release for that tag. Do not build PHP packages here.
#
# Prerequisites:
#   - Monorepo split-packages.yml has already mirrored the tag (SPLIT_GITHUB_TOKEN
#     is monorepo-only; this child workflow uses GITHUB_TOKEN only).
#   - Package-root .goreleaser.yml (GoReleaser v2) with release.mode: replace so
#     retags overwrite assets/notes instead of failing.
#
# Permissions: contents: write is enough for unsigned publish via GITHUB_TOKEN.
# Platform signing (REQ-063) is secret-gated: when Apple/Windows secrets are
# absent the release still publishes unsigned multi-arch assets + checksums and
# logs "signing skipped". See docs/release-signing.md for secret names.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to module directive in go.mod (go 1.22), not floating "stable".
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

      - name: Platform signing status
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE_BASE64}" ] || [ -n "${WINDOWS_CERT_BASE64}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Platform signing secrets detected; hooks will sign when tooling/runner allow (see docs/release-signing.md)."
            if [ -n "${APPLE_CERTIFICATE_BASE64}" ]; then
              echo "Apple secrets present (APPLE_CERTIFICATE_BASE64)."
            fi
            if [ -n "${WINDOWS_CERT_BASE64}" ]; then
              echo "Windows secrets present (WINDOWS_CERT_BASE64)."
            fi
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "signing skipped: no APPLE_* / WINDOWS_* secrets present; publishing unsigned multi-arch assets"
          fi

      - name: Install osslsigncode (Windows Authenticode, secret-gated)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osslsigncode
          osslsigncode -v || true

      - name: Apple signing notice (secret-gated)
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "Apple signing secrets present (APPLE_CERTIFICATE_BASE64)."
          echo "Full codesign/notarization requires a macOS runner; on ubuntu-latest the"
          echo "post-build hook soft-skips darwin with a clear 'signing skipped' log."
          echo "See docs/release-signing.md for APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID,"
          echo "APPLE_ID / APPLE_ID_PASSWORD, APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pin to GoReleaser v2.x (matches package .goreleaser.yml version: 2).
          version: '~> v2'
          # release --clean: publish GitHub Release; .goreleaser.yml uses
          # release.mode: replace + replace_existing_artifacts so a retag
          # updates the same tag's assets rather than failing.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple (optional — empty when unset; hooks soft-skip).
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          # Windows Authenticode (optional — empty when unset; hooks soft-skip).
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
