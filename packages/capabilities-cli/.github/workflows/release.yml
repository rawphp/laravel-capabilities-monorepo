# Package-owned release for rawphp/capabilities-cli (binary: capabilities).
#
# After monorepo split force-pushes a mirrored v* tag onto this repo, this
# workflow builds multi-arch binaries with GoReleaser and creates or updates
# the GitHub Release for that tag. Do not build PHP packages here.
#
# Prerequisites:
#   - Monorepo split-packages.yml has already mirrored the tag (SPLIT_GITHUB_TOKEN
#     is monorepo-only; this child workflow uses GITHUB_TOKEN only).
#   - Package-root .goreleaser.yml (GoReleaser v2) with release.mode: replace so
#     retags overwrite assets/notes instead of failing.
#
# Permissions: contents: write is enough for unsigned publish via GITHUB_TOKEN.
# Platform signing (REQ-063) is secret-gated: when Apple/Windows secrets are
# absent the release still publishes unsigned multi-arch assets + checksums and
# logs "signing skipped". See docs/release-signing.md for secret names.
#
# Runner selection (REQ-065): a prepare job picks macos-latest when
# APPLE_CERTIFICATE_BASE64 is set (codesign/notary need Darwin). Otherwise
# ubuntu-latest. Never use `if: secrets.*` — GitHub rejects that and yields 0 jobs.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Detect Apple cert without putting secrets in job if: expressions.
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      apple_present: ${{ steps.pick.outputs.apple_present }}
    steps:
      - name: Choose runner for GoReleaser
        id: pick
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE_BASE64}" ]; then
            echo "runner=macos-latest" >> "${GITHUB_OUTPUT}"
            echo "apple_present=true" >> "${GITHUB_OUTPUT}"
            echo "Apple certificate secret present → macos-latest (codesign/notary)."
          else
            echo "runner=ubuntu-latest" >> "${GITHUB_OUTPUT}"
            echo "apple_present=false" >> "${GITHUB_OUTPUT}"
            echo "No Apple certificate secret → ubuntu-latest (unsigned darwin soft path)."
          fi

  # Always test on Linux. macOS 26 + older Go can emit binaries without LC_UUID
  # (dyld abort). Keep the Darwin runner for codesign/notary only.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  goreleaser:
    needs: [select-runner, test]
    runs-on: ${{ needs.select-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to module directive in go.mod (go 1.24+), not floating "stable".
          # Go 1.22.x on macos-26-arm64: missing LC_UUID → dyld abort on binaries.
          go-version-file: go.mod

      # Secrets may be used in env:, but NOT in step/job `if:` (GitHub rejects
      # "Unrecognized named-value: 'secrets'" and the whole workflow fails with 0 jobs).
      # Detect presence here and gate later steps on step outputs.
      - name: Platform signing status
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          set -euo pipefail
          apple=false
          windows=false
          if [ -n "${APPLE_CERTIFICATE_BASE64}" ]; then
            apple=true
            echo "Apple secrets present (APPLE_CERTIFICATE_BASE64)."
          fi
          if [ -n "${WINDOWS_CERT_BASE64}" ]; then
            windows=true
            echo "Windows secrets present (WINDOWS_CERT_BASE64)."
          fi
          echo "apple_present=${apple}" >> "${GITHUB_OUTPUT}"
          echo "windows_present=${windows}" >> "${GITHUB_OUTPUT}"
          if [ "${apple}" = true ] || [ "${windows}" = true ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Platform signing secrets detected; hooks will sign when tooling/runner allow (see docs/release-signing.md)."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "signing skipped: no APPLE_* / WINDOWS_* secrets present; publishing unsigned multi-arch assets"
          fi
          echo "runner_os=$(uname -s)" >> "${GITHUB_OUTPUT}"
          echo "Host: $(uname -s) $(uname -m); select-runner chose ${{ needs.select-runner.outputs.runner }}"

      - name: Install osslsigncode (Windows Authenticode, secret-gated)
        if: steps.signing.outputs.windows_present == 'true'
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = "Darwin" ]; then
            brew install osslsigncode
          else
            sudo apt-get update
            sudo apt-get install -y osslsigncode
          fi
          osslsigncode -v || true

      - name: Apple signing readiness
        if: steps.signing.outputs.apple_present == 'true'
        run: |
          set -euo pipefail
          echo "Apple signing secrets present (APPLE_CERTIFICATE_BASE64)."
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "Host is Darwin — post-build hooks will codesign; notarize when APPLE_API_KEY_* (or APPLE_ID path) secrets are set."
          else
            echo "Host is not Darwin — hooks soft-skip codesign (see docs/release-signing.md)."
            echo "select-runner should have chosen macos-latest when Apple cert is set; check select-runner logs."
          fi
          echo "Also used when present: APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID,"
          echo "APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8 (or APPLE_ID + APPLE_ID_PASSWORD)."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pin to GoReleaser v2.x (matches package .goreleaser.yml version: 2).
          version: '~> v2'
          # release --clean: publish GitHub Release; .goreleaser.yml uses
          # release.mode: replace + replace_existing_artifacts so a retag
          # updates the same tag's assets rather than failing.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple (optional — empty when unset; hooks soft-skip).
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          # Windows Authenticode (optional — empty when unset; hooks soft-skip).
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
