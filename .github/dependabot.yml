# Dependabot — monorepo dependency updates (X-009)
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: "/packages/capabilities-cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Both workflow roots: monorepo CI and the CLI's own release pipeline
  # (packages/capabilities-cli/.github/workflows holds the signing secrets and
  # reaches rawphp/capabilities-cli through the split).
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/packages/capabilities-cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
