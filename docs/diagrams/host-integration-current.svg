<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1020" viewBox="0 0 1480 1020" role="img" aria-label="Current architecture: host integration reality">
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .t { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 13px; font-weight: 400; fill: #475569; }
      .lane { font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .ph { font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .ps { font-size: 11px; font-weight: 400; fill: #cbd5e1; }
      .bt { font-size: 12px; font-weight: 650; fill: #0f172a; }
      .bb { font-size: 11px; font-weight: 400; fill: #334155; }
      .pt { font-size: 12px; font-weight: 650; fill: #9f1239; }
      .pb { font-size: 11px; font-weight: 400; fill: #9f1239; }
      .lg { font-size: 11px; font-weight: 400; fill: #334155; }
      .badge { font-size: 11px; font-weight: 700; fill: #9f1239; }
    </style>
  </defs>

  <rect width="1480" height="1020" fill="#ffffff"/>

  <!-- Badge + title -->
  <rect x="40" y="22" width="72" height="24" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
  <text x="76" y="39" text-anchor="middle" class="badge">BEFORE</text>
  <text x="128" y="42" class="t">Current architecture</text>
  <text x="40" y="68" class="s">Package map is correct. Pain is host glue + a few unsafe package defaults — not a wrong bus.</text>

  <!-- ========== HOST ========== -->
  <rect x="40" y="88" width="1400" height="200" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="56" y="112" class="lane">HOST APP  ·  domain + product UX  ·  compensates for missing package knobs</text>

  <!-- Host OK row -->
  <rect x="56" y="128" width="440" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="72" y="150" class="bt">Domain capabilities + Authorizer</text>
  <text x="72" y="168" class="bb">Define once · schemas · authorize() · host policy</text>

  <rect x="512" y="128" width="440" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="528" y="150" class="bt">Product / iOS HTTP</text>
  <text x="528" y="168" class="bb">Should call bus / AI services · often fights package routes</text>

  <rect x="968" y="128" width="452" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="984" y="150" class="bt">Optional AI host seams</text>
  <text x="984" y="168" class="bb">Context + ToolCatalog · Progress side-effects (TTS…)</text>

  <!-- Host pain row -->
  <rect x="56" y="202" width="340" height="68" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="72" y="224" class="pt">Pain · rebind ConversationService</text>
  <text x="72" y="242" class="pb">Only way to set queue name / connection</text>
  <text x="72" y="258" class="pb">on default RunTurnJob dispatch</text>

  <rect x="412" y="202" width="340" height="68" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="428" y="224" class="pt">Pain · route surgery</text>
  <text x="428" y="242" class="pb">Hijack package HTTP for product UX</text>
  <text x="428" y="258" class="pb">Brittle vs package renames</text>

  <rect x="768" y="202" width="340" height="68" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="784" y="224" class="pt">Pain · dual chat / host reapers</text>
  <text x="784" y="242" class="pb">Second turn tables; reapers hit wrong</text>
  <text x="784" y="258" class="pb">tables · no package reaper</text>

  <rect x="1124" y="202" width="296" height="68" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="1140" y="224" class="pt">Pain · replace ProgressStore</text>
  <text x="1140" y="242" class="pb">singleton() wipes redis/array</text>
  <text x="1140" y="258" class="pb">instead of extend() wrapper</text>

  <!-- ========== PACKAGES ========== -->
  <rect x="40" y="312" width="1400" height="628" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="56" y="336" class="lane">PACKAGES  ·  four products  ·  develop in monorepo · ship as split repos</text>

  <!-- Col positions: 56, 406, 756, 1106  width 330 -->
  <!-- CORE -->
  <g>
    <rect x="56" y="352" width="330" height="430" rx="8" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M56,352 h330 a8,8 0 0 1 8,8 v36 h-346 v-36 a8,8 0 0 1 8,-8 z" fill="#1e3a5f"/>
    <text x="72" y="376" class="ph">laravel-capabilities</text>
    <text x="72" y="392" class="ps">Core bus · registry · surfaces</text>

    <rect x="72" y="416" width="298" height="52" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="84" y="436" class="bt">CapabilityBus + Registry</text>
    <text x="84" y="454" class="bb">One run() · single choke point · solid</text>

    <rect x="72" y="480" width="298" height="52" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="84" y="500" class="bt">Surfaces</text>
    <text x="84" y="518" class="bb">HTTP · MCP · agent · job · artisan · cli</text>

    <rect x="72" y="544" width="298" height="68" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="84" y="564" class="pt">MCP weak spots</text>
    <text x="84" y="582" class="pb">No allowlist name validation</text>
    <text x="84" y="598" class="pb">Mid-register can stay quiet</text>

    <rect x="72" y="624" width="298" height="52" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="84" y="644" class="bt">HTTP …/capabilities/health</text>
    <text x="84" y="662" class="bb">Surface / peer health only</text>

    <rect x="72" y="688" width="298" height="68" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="84" y="708" class="pt">Missing diagnostic</text>
    <text x="84" y="726" class="pb">No integration-health Artisan</text>
    <text x="84" y="742" class="pb">Cannot see product-ready vs installed</text>
  </g>

  <!-- AI -->
  <g>
    <rect x="406" y="352" width="330" height="430" rx="8" fill="#ffffff" stroke="#3b1f5e" stroke-width="2"/>
    <path d="M406,352 h330 a8,8 0 0 1 8,8 v36 h-346 v-36 a8,8 0 0 1 8,-8 z" fill="#3b1f5e"/>
    <text x="422" y="376" class="ph">laravel-capabilities-ai</text>
    <text x="422" y="392" class="ps">Turn · conversation · proposals</text>

    <rect x="422" y="416" width="298" height="52" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="434" y="436" class="bt">SP owns service wiring</text>
    <text x="434" y="454" class="bb">Conversation · Turn · Proposal · solid</text>

    <rect x="422" y="480" width="298" height="68" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="434" y="500" class="pt">Default dispatch gap</text>
    <text x="434" y="518" class="pb">RunTurnJob ignores queue.name /</text>
    <text x="434" y="534" class="pb">connection config</text>

    <rect x="422" y="560" width="298" height="68" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="434" y="580" class="pt">AlwaysReady default</text>
    <text x="434" y="598" class="pb">Idempotency always “ready”</text>
    <text x="434" y="614" class="pb">Unsafe on proposal accept</text>

    <rect x="422" y="640" width="298" height="52" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="434" y="660" class="pt">Proposals always on</text>
    <text x="434" y="678" class="pb">Routes + fence when routes enabled</text>

    <rect x="422" y="704" width="298" height="52" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="434" y="724" class="pt">No package reaper</text>
    <text x="434" y="742" class="pb">Stale turns left to host hacks</text>
  </g>

  <!-- MESSAGING -->
  <g>
    <rect x="756" y="352" width="330" height="430" rx="8" fill="#ffffff" stroke="#14532d" stroke-width="2"/>
    <path d="M756,352 h330 a8,8 0 0 1 8,8 v36 h-346 v-36 a8,8 0 0 1 8,-8 z" fill="#14532d"/>
    <text x="772" y="376" class="ph">laravel-capabilities-messaging</text>
    <text x="772" y="392" class="ps">Optional channel sibling</text>

    <rect x="772" y="416" width="298" height="68" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="784" y="436" class="bt">Telegram first</text>
    <text x="784" y="454" class="bb">Webhooks · identity · threads</text>
    <text x="784" y="470" class="bb">Implements core contracts only</text>

    <rect x="772" y="500" width="298" height="68" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="784" y="520" class="bt">No second turn runtime</text>
    <text x="784" y="538" class="bb">Must not reimplement AI runner</text>
    <text x="784" y="554" class="bb">Must not rebind AI services</text>

    <rect x="772" y="584" width="298" height="84" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="784" y="608" class="bt">Role in the system</text>
    <text x="784" y="626" class="bb">Channel adapter only</text>
    <text x="784" y="642" class="bb">Not part of host-integration</text>
    <text x="784" y="658" class="bb">package gaps (below)</text>

    <rect x="772" y="684" width="298" height="72" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="784" y="708" class="bt">Defaults off</text>
    <text x="784" y="726" class="bb">messaging surface off until</text>
    <text x="784" y="742" class="bb">package installed + enabled</text>
  </g>

  <!-- CLI -->
  <g>
    <rect x="1106" y="352" width="314" height="430" rx="8" fill="#ffffff" stroke="#713f12" stroke-width="2"/>
    <path d="M1106,352 h314 a8,8 0 0 1 8,8 v36 h-330 v-36 a8,8 0 0 1 8,-8 z" fill="#713f12"/>
    <text x="1122" y="376" class="ph">capabilities-cli (Go)</text>
    <text x="1122" y="392" class="ps">Product CLI · not Artisan</text>

    <rect x="1122" y="416" width="282" height="68" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="1134" y="436" class="bt">HTTP client only</text>
    <text x="1134" y="454" class="bb">auth · catalog · run</text>
    <text x="1134" y="470" class="bb">caller=cli · host PAT minting</text>

    <rect x="1122" y="500" width="282" height="52" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="1134" y="520" class="bt">No domain logic in CLI</text>
    <text x="1134" y="538" class="bb">Server re-validates always</text>

    <rect x="1122" y="568" width="282" height="68" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="1134" y="588" class="bt">No MCP stdio</text>
    <text x="1134" y="606" class="bb">Product MCP is server-side</text>
    <text x="1134" y="622" class="bb">(laravel/mcp via core)</text>

    <rect x="1122" y="652" width="282" height="104" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="1134" y="676" class="bt">Unchanged by rearchitecture</text>
    <text x="1134" y="694" class="bb">Still one HTTP capability API</text>
    <text x="1134" y="710" class="bb">No second invoke tree for CLI</text>
    <text x="1134" y="726" class="bb">Artisan remains ops-only</text>
  </g>

  <!-- Bottom strip: flows + reinvented -->
  <rect x="56" y="800" width="1364" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="72" y="822" class="bt">Key flows (unchanged by migration)</text>
  <text x="72" y="844" class="bb">1. Host capabilities → Registry → any surface</text>
  <text x="400" y="844" class="bb">2. AI create → RunTurnJob → TurnRunner → bus tools only</text>
  <text x="820" y="844" class="bb">3. CLI/HTTP → one core HTTP API</text>
  <text x="1120" y="844" class="bb">4. Messaging → bus only</text>
  <text x="72" y="874" class="pt">Hosts reinvent today (package gaps)</text>
  <text x="72" y="894" class="pb">Queue routing · live idempotency · stale-turn reaper · product-ready diagnostic · loud MCP errors  →  rebinds, route hijacks, dual chat, silent wrong prod</text>

  <!-- Legend -->
  <rect x="40" y="960" width="1400" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="56" y="972" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="80" y="984" class="lg">Solid today</text>
  <rect x="180" y="972" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="204" y="984" class="lg">Present · not the problem</text>
  <rect x="390" y="972" width="16" height="16" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="414" y="984" class="lg">Gap / host pain (migrate away)</text>
  <text x="680" y="984" class="lg">Orange frame = host  ·  Grey frame = packages  ·  Four equal package columns</text>
</svg>
